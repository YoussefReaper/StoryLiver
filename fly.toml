# Fly.io — free allowance. `fly launch --no-deploy`, then `fly deploy`.
app = "storyliver"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  STORYLIVER_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[mounts]
  source = "storyliver_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
