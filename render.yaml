# Render blueprint — free tier. Push this repo, point Render at it, add the key.
services:
  - type: web
    name: storyliver
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENAI_API_KEY
        sync: false            # set this in the Render dashboard
      - key: REDIS_URL
        sync: false            # Upstash connection string (rediss://…) - optional, single instance only
      - key: MONGODB_URI
        sync: false            # MongoDB Atlas free M0 - makes data survive spin-down/redeploy on this plan
      - key: STORYLIVER_CORS
        sync: false            # e.g. https://storyliver.pages.dev
    # NOTE: Render's free web services do not support a persistent disk at
    # all - that is a paid-plan feature. Local storage here is wiped on every
    # spin-down and redeploy. Set MONGODB_URI above (a free Atlas M0 cluster)
    # so nothing is actually lost when that happens; without it, this plan is
    # fine for a single sitting but will not remember anything across days.
